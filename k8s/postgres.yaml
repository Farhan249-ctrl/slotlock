# ==============================================================================
# PostgreSQL Database: PVC, Deployment, and ClusterIP Service
# Single-replica deployment using Recreate strategy and persistent storage
# ==============================================================================

# 1. Persistent Storage Claim (1Gi)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: slotlock
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: slotlock
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 2. Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: slotlock
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: slotlock
spec:
  replicas: 1
  # Recreate strategy ensures old pod releases PVC lock before new pod mounts it
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          # Backend HikariCP pool is 50 connections per replica; 300 leaves
          # headroom for 3+ replicas, Flyway and superuser connections
          args: ["-c", "max_connections=300"]
          env:
            # Subdirectory path inside PVC mount to prevent lost+found collision
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: slotlock-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: slotlock-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slotlock-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - slotlock
                - -d
                - slotlock
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# 3. Internal ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: slotlock
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: slotlock
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
