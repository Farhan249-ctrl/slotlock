# ==============================================================================
# Backend Service: Spring Boot 3 API (2 Replicas) + ClusterIP Service
# Uses envFrom for Secret and explicit env from ConfigMap (ConfigMap 5432 overrides Secret 5433)
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: slotlock
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: slotlock
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: farhan14031/slotlock-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # 1. Load all secret credentials (JWT_SECRET, ADMIN_PASSWORD, POSTGRES_PASSWORD)
          envFrom:
            - secretRef:
                name: slotlock-secrets
          # 2. Explicit ConfigMap values override conflicting secret variables
          # (ConfigMap POSTGRES_PORT=5432 takes precedence over .env's 5433)
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: slotlock-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: slotlock-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: slotlock-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: slotlock-config
                  key: POSTGRES_USER
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: slotlock-config
                  key: ADMIN_EMAIL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Startup probe on the same path as the Docker HEALTHCHECK
          # (/actuator/health); allows ~200s for JVM boot before liveness/readiness start
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: slotlock
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: slotlock
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: backend
